name: update-articles
on:
  schedule:
    # 专栏每半月更新一次：UTC 每月 1 日、16 日 10:30（北京时间 18:30）
    - cron: '30 10 1,16 * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python spider_articles.py
      - run: python gen_page.py
        env:
          OWN_KEY: ${{ secrets.XINGYU_OWN_KEY }}
      - name: Commit updated articles
        run: |
          git config user.name "xingyu-bot"
          git config user.email "xingyu-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto update articles $(date +'%Y-%m-%d %H:%M')"
          git push
