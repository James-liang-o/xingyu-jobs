name: update-articles
on:
  schedule:
    # 专栏每半月更新一次：UTC 每月 1 日、15 日 10:30（北京时间 18:30），三站各自专栏
    - cron: '30 10 1,15 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.XINGYU_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python spider_articles.py
      - run: python gen_page.py
        env:
          OWN_KEY: ${{ secrets.XINGYU_OWN_KEY }}
      - run: python gen_page.py mental
        env:
          OWN_KEY: ${{ secrets.XINGYU_OWN_KEY }}
      - run: python gen_page.py physical
        env:
          OWN_KEY: ${{ secrets.XINGYU_OWN_KEY }}
      - name: Commit & push 主站
        run: |
          git config user.name "xingyu-bot"
          git config user.email "xingyu-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto update articles $(date +'%Y-%m-%d %H:%M')"
          git push
      - name: Push 心行 / 健行 友站
        if: env.PAT != ''
        run: |
          git config --global user.name "xingyu-bot"
          git config --global user.email "xingyu-bot@users.noreply.github.com"
          for repo in "xingyu-mental:心行_精神障碍岗位导航.html" "xingyu-physical:健行_身体残疾岗位导航.html"; do
            r="${repo%%:*}"; f="${repo##*:}"
            rm -rf /tmp/$r && git clone -q --depth 1 "https://x:${PAT}@github.com/James-liang-o/${r}.git" /tmp/$r
            cp "$f" /tmp/$r/index.html
            cd /tmp/$r
            git add -A
            git diff --cached --quiet || { git commit -m "auto update articles $(date +'%Y-%m-%d %H:%M')"; git push -q; }
            cd "$GITHUB_WORKSPACE"
          done
