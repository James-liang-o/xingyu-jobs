name: update-jobs
on:
  schedule:
    # 岗位每天更新一次：UTC 每天 10:15（北京时间 18:15），失效岗位自动标记保留
    - cron: '15 10 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install xlrd requests
      - run: python spider_national.py
      - run: python gen_page.py
        env:
          OWN_KEY: ${{ secrets.XINGYU_OWN_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "xingyu-bot"
          git config user.email "xingyu-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto update $(date +'%Y-%m-%d %H:%M')"
          git push
